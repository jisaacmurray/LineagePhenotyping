# LineagePhenotyping pipeline config template.
#
# Run with:  Rscript run_pipeline.R configs/<this-file>.yaml
#
# Path resolution rules:
#   - Absolute paths are used as-is.
#   - Relative paths under `data_dir` are resolved against this config file's
#     directory (so configs are portable when copied with their data).
#   - Relative paths under `expression_file`, `wt_ref_dir`, `embryo_metadata_file`
#     are resolved against `data_dir`.
#   - Relative paths under `cell_names_file`, `cell_lineage_order_file` are
#     resolved against the runner's directory (where run_pipeline.R lives),
#     because those are reference files shipped with the code.

# --- Required ----------------------------------------------------------

# Dataset identifier. Used as the file-name prefix for inputs and outputs:
#   <data_dir>/<name>/<name>positions.txt   (input)
#   <output_dir>/<name>_ccDevs.csv          (output)
name: my_dataset

# Root directory containing per-dataset input subdirectories. The expected
# layout under data_dir is:
#   <data_dir>/<name>/                          input data for this run
#   <data_dir>/Richard_et_al_plus_comma_WT/     WT reference (override below)
#   <data_dir>/data/<expression_file>           expression CSVs (override below)
data_dir: /absolute/path/to/your/data/root

# --- Optional paths ----------------------------------------------------

# Where outputs should land. Default: <data_dir>/<name>/  (legacy in-place).
# output_dir: /absolute/path/to/output/my_dataset

# Phase 5.5 (integrated from wllmwlkrsn/LineagePhenotyping@fad4259):
# Where the LineagePhenotyping R scripts + script-bundled reference
# files (CellNames.csv, Cells_350min_lineageOrder.csv) live. Defaults
# to the directory containing run_pipeline.R itself, so omit this key
# for the common case where the scripts travel together with
# run_pipeline.R. Set this when your script tree is in a separate
# read-only location from your data — e.g. a shared install at
# /opt/LineagePhenotyping/ with per-user data and configs elsewhere.
#
# When set, `cell_names_file` and `cell_lineage_order_file` default
# to being looked up under `script_dir`. The CWD switches to
# `script_dir` before sourcing helper scripts so bare
# `source("functions.R")` calls inside them resolve correctly
# (this also fixes a latent bug where the previous default
# `setwd(data_dir)` only worked because the original Dropbox tree
# happened to contain functions.R next to the data).
#
# `wt_ref_dir` still defaults to <data_dir>/Richard_et_al_plus_comma_WT
# because the WT bundle is conventionally a per-dataset reference; a
# script-bundled fallback at <script_dir>/Richard_et_al_plus_comma_WT
# is used automatically if the data_dir copy is missing.
# script_dir: /absolute/path/to/LineagePhenotyping

# WT reference directory. Default: <data_dir>/Richard_et_al_plus_comma_WT/
# The basename of this path is also used as the prefix for the WT files
# (e.g. "Richard_et_al_plus_comma_WTDivTimeNorm.tsv"), so don't rename
# arbitrarily — clone the existing WT bundle if you need a different copy.
# wt_ref_dir: Richard_et_al_plus_comma_WT

# Cell-level peak expression CSV consumed by ReadPeakExpression.
# Relative to data_dir.
# expression_file: data/CA20230328_my_marker.csv

# Per-embryo metadata for grouping in PlotComparisonBoxplots and the
# UMAP/PCA reports. Optional. Relative to data_dir.
# embryo_metadata_file: embryo_metadata.csv

# Reference files shipped with the code. These rarely need overriding;
# defaults resolve against the directory containing run_pipeline.R.
# cell_names_file: CellNames.csv
# cell_lineage_order_file: Cells_350min_lineageOrder.csv

# --- Numeric parameters ------------------------------------------------
# (Defaults below match LineagePhenotyping_ceh76.R.)
params:
  expCutoff:     200    # min expression to call a cell "expressing"
  sig:           3      # Z-score threshold for division-time defects
  microns:       5      # position deviation threshold (µm)
  posDevTime:    250    # time point used for arrow/projection plots
  minDivTime:    70     # ignore cells dividing before this time
  peak_recalc:   true   # recompute peak after AnalyzeDivTimes finds full cell set
  dim_reduction: true   # run UMAP/PCA reports (requires umap package; ~3-5 min extra)

  # --- Phase 5.2: output organization --------------------------------
  # "by_kind" (default) routes display files (PDF/PNG/JPG) into
  # <output_dir>/plots/<cc|position|angle|expression|boxplots|summary>/
  # for easier navigation. Data files (.csv, .tsv, .txt) stay at top.
  # Set "flat" for legacy byte-identical layout.
  subdir_layout:   by_kind
  # Per-frame jpg directories produced by the arrows plots are temp
  # scratch used to assemble the corresponding PDFs. Default deletes
  # them after the PDFs are sealed; set true to keep (e.g. for
  # making a movie from the frames).
  keep_arrow_jpgs: false

  # --- Phase 5: defect-colored lineage trees -------------------------
  defect_trees:        true       # render lineage trees colored by CC,
                                  # position, dot, and arbitrary defects
  defect_tree_root:    P0         # tree root for defect plots
  defect_tree_split_roots:        # column panels per page
    - ABa
    - ABp
    - P1
  # Optional dynamic end-time. null = full timecourse (default).
  # defect_tree_milestone:
  #   lineage: MS
  #   n_cells: 32
  # Phase 5.3H2(a): drop (cell, time, embryo) values where that embryo
  # has fewer than this many cells alive at that timepoint. Workaround
  # for late-timepoint tracking cliffs (e.g. JIM721 L4 drops from 567
  # cells at t=352 to 80 by t=410, which biases rotation alignment and
  # produces artefactual deviation spikes for surviving cells like
  # ABprppppppp/ABprppppppa). null = no filter. Tune per dataset; ~half
  # of peak cell count is a good starting heuristic.
  # min_cells_per_timepoint: 200

  # Phase 5.4: per-defect-kind grey-band sensitivity overrides.
  # Each key sets the half-width of the central no-defect band for that
  # kind. Defaults (the values commented out below) are tuned to keep
  # WT-WT noise in grey while highlighting biologically meaningful
  # deviations. Override only the kinds you want to change; the rest
  # keep their defaults. Common reasons to tweak: a noisy channel where
  # you want a wider band, or an exceptionally clean dataset where you
  # want maximum sensitivity. Bands are in the same units as the kind
  # (µm for position kinds, minutes for cc_dev, z-score for *_z).
  # defect_scheme_bands:
  #   position_dev:               2     # floor; values <= this read as grey
  #   position_dev_AP:             1.5  # ± µm grey band (signed AP)
  #   position_dev_radial_signed:  1.5  # ± µm grey band (signed in/out)
  #   position_dev_z:              2    # ± z-score grey band
  #   cc_dev:                      5    # ± minutes grey band
  #   cc_dev_z:                    3    # ± z-score grey band
  #   dot_dev:                     0    # no band; always coloured
  # Optional extra phenotype frames to plot.
  # defect_tree_arbitrary:
  #   - label: my_phenotype
  #     file: data/my_phenotype_long.csv
  #     cell_col: cell
  #     time_col: time
  #     value_col: score
